<div class="home">
    <div class="hero">
        <h1>Descubrí tu próxima película</h1>
        <p>Buscá por título, explorá por género</p>
        <app-search-bar #searchbar (searchChange)="search($event)" />
    </div>

    <div class="genres">
        @for (genre of genres; track genre.id) {
            <button class="genre-btn" [class.active]="selectedGenreId === genre.id" (click)="filterByGenre(genre.id)">
                {{ genre.name }}
            </button>
        }
    </div>

    @if (loading) {
        <div class="loading">
            <i class="ti ti-loader-2" aria-hidden="true"></i> Cargando...
        </div>
    }

    @if (!loading) {
        <div class="section">
            <h2>{{ isSearching ? 'Resultados' : 'Populares ahora' }}</h2>
            <div class="movies-grid">
                @for (movie of movies; track movie.id) {
                    <app-movie-card [movie]="movie" [favorite]="isFavorite(movie.id)" />
                }
            </div>
        </div>
    }
</div>
