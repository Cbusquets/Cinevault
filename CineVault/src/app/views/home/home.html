<div class="home">
  <div class="hero">
    <h1>Descubrí tu próxima película</h1>
    <p>Buscá por título, explorá por género</p>
    <div class="search-box">
      <i class="ti ti-search" aria-hidden="true"></i>
      <input
        type="text"
        placeholder="Ej: Inception, Dune..."
        [(ngModel)]="searchQuery"
        (keyup.enter)="search()"
      />
      <button (click)="search()">Buscar</button>
    </div>
  </div>

  @if (loading) {
    <div class="loading">
      <i class="ti ti-loader-2" aria-hidden="true"></i> Cargando...
    </div>
  }

  @if (!loading) {
    <div class="section">
      <h2>{{ searchQuery ? 'Resultados' : 'Populares ahora' }}</h2>
      <div class="movies-grid">
        @for (movie of movies; track movie.id) {
          <app-movie-card
            [movie]="movie"
            [favorite] = "isFavorite(movie.id)"/>
        }
      </div>
    </div>
  }
</div>
